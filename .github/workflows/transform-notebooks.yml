name: Compile Markdown Notebooks

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.md'
  pull_request:
    paths:
      - 'src/**/*.md'

permissions:
  contents: write

jobs:
  compile:
    name: Compile Markdown to Jupyter Notebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Notebooks
        run: |
          mkdir -p artifacts
          for file in src/*.md; do
            if [ -f "$file" ]; then
              basename=$(basename "$file" .md)
              echo "Compiling $file -> artifacts/${basename}.ipynb"
              python3 .github/scripts/convert_notebook.py --to-ipynb "$file" "artifacts/${basename}.ipynb"
            fi
          done

      - name: Auto-commit compiled notebooks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile markdown notebooks to artifacts/ [skip ci]"
          file_pattern: 'artifacts/*.ipynb'
