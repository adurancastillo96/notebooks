name: AI Notebook Code Review

on:
  pull_request:
    paths:
      - 'src/**/*.ipynb'

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get notebook diff
        id: diff
        run: |
          git fetch origin main --depth=1
          DIFF=$(git diff origin/main...HEAD -- 'src/**/*.ipynb' | head -c 30000)
          echo "notebook_diff<<DIFF_EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT

      - name: Read review prompt
        id: prompt
        run: |
          PROMPT=$(cat .github/prompts/notebook-review-prompt.md)
          echo "system_prompt<<PROMPT_EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "PROMPT_EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API
        id: review
        if: steps.diff.outputs.notebook_diff != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg system "${{ steps.prompt.outputs.system_prompt }}" \
              --arg diff "${{ steps.diff.outputs.notebook_diff }}" \
              '{
                "system_instruction": {"parts": [{"text": $system}]},
                "contents": [{"parts": [{"text": ("Review the following notebook changes:\n\n" + $diff)}]}],
                "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096}
              }')")
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Review could not be generated."')
          echo "review_text<<REVIEW_EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "REVIEW_EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        if: steps.review.outputs.review_text != '' && steps.review.outputs.review_text != 'Review could not be generated.'
        uses: actions/github-script@v7
        with:
          script: |
            const review = `## 🤖 AI Notebook Review (Gemini)

            ${process.env.REVIEW_TEXT}

            ---
            *Automated review by Gemini. Please verify suggestions before applying.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });
        env:
          REVIEW_TEXT: ${{ steps.review.outputs.review_text }}
