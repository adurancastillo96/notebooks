name: TODO/Placeholder Check

on:
  pull_request:
    paths:
      - 'src/**/*.md'

jobs:
  todo-check:
    name: Check for Unfilled Placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Find changed notebooks
        id: changed
        run: |
          git fetch origin main --depth=1
          NOTEBOOKS=$(git diff --name-only origin/main...HEAD -- 'src/**/*.md' | tr '\n' ' ')
          echo "files=$NOTEBOOKS" >> $GITHUB_OUTPUT

      - name: Check for unfilled TODOs
        if: steps.changed.outputs.files != ''
        run: python .github/scripts/check_todos.py ${{ steps.changed.outputs.files }}
